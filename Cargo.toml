[workspace]
resolver = "2"
members = ["crates/dts-server", "crates/dts-backend", "crates/dts-backend-rdbms", "crates/dts-backend-postgres", "crates/dts-backend-sqlite", "crates/dts-core", "crates/dts-engine", "crates/dts-engine-ape"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
dashmap = "6"
async-trait = "0.1"
rand = "0.8"
dotenv = "0.15"

[workspace.lints.clippy]
# 正确性 — 必须修复
unwrap_used = "deny"
expect_used = "deny"
# 性能
redundant_clone = "warn"
clone_on_copy = "warn"
# 错误处理
manual_ok_or = "warn"
# 复杂度
too_many_arguments = "warn"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"

[profile.release]
panic = 'unwind'
opt-level = 3
lto = true
codegen-units = 1
