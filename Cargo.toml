[workspace]
resolver = "2"
members = ["crates/dts-server"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dashmap = "6"
async-trait = "0.1"
rand = "0.8"
dotenv = "0.15"

[profile.release]
panic = 'unwind'
opt-level = 3
lto = true
codegen-units = 1
