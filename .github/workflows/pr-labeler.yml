# DTS Platform - PR 自动标签
# 根据变更文件路径自动为 PR 添加标签

name: PR Labeler

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: 自动标签
    runs-on: ubuntu-latest

    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
