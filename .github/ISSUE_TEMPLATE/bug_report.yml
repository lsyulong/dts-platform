name: Bug 报告
description: 提交 Bug 报告以帮助我们改进系统
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间填写此 Bug 报告！请尽可能详细地描述问题。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清晰简洁地描述遇到的问题。
      placeholder: 例如：点击"保存"按钮后，页面无响应，数据未保存。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请详细列出复现该问题的步骤。
      placeholder: |
        1. 打开页面 '...'
        2. 点击 '...'
        3. 输入 '...'
        4. 观察到错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 请描述你期望发生什么。
      placeholder: 点击"保存"按钮后，应该显示"保存成功"提示，数据应被持久化。
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 如果有截图，请在此粘贴或拖入（有助于快速定位问题）。

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 请提供你的运行环境信息。
      value: |
        - 操作系统: [例如 Windows 10, macOS 14]
        - 浏览器: [例如 Chrome 120, Firefox 121]
        - Rust 版本: [例如 1.88.0]
        - Node 版本: [例如 22]
        - 应用版本/分支: [例如 main]
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 任何其他有助于排查问题的信息。
