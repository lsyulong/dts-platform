name: 功能请求
description: 请求一个新功能或改进建议
title: "[Feature]: "
labels: ["enhancement", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢你对 DTS Platform 的关注！请填写以下信息以帮助我们理解你的需求。

  - type: textarea
    id: problem
    attributes:
      label: 问题或需求
      description: 你的功能请求要解决什么问题？请描述当前遇到的痛点或限制。
      placeholder: 例如：当前系统无法批量导入数据源配置，每次只能逐条添加，效率很低。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 你希望系统如何解决这个问题？请描述你期望的功能。
      placeholder: 例如：希望能通过上传 CSV 文件或粘贴 JSON 数组来批量导入数据源配置。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些替代方案或变通方法？
      placeholder: 例如：暂时通过脚本直接操作数据库来批量导入。

  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      description: 此功能主要涉及哪些模块？
      options:
        - label: 后端 (Rust/actix-web)
        - label: 前端 (React/TypeScript)
        - label: 数据库 (SQLite/sqlx)
        - label: 基础设施/CI

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 任何其他有帮助的信息，如参考链接、设计稿等。
    validations:
      required: false
