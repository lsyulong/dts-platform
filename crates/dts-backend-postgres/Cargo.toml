[package]
name = "dts-backend-postgres"
version = "0.1.0"
edition = "2021"
description = "DTS Platform — PostgreSQL 协议存储后端（支持 PostgreSQL / Supabase / GaussDB / Kingbase / openGauss 等）"

[dependencies]
dts-backend = { path = "../dts-backend" }
dts-backend-rdbms = { path = "../dts-backend-rdbms" }
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
log = "0.4"
argon2 = "0.5"
