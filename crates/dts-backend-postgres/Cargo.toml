[package]
name = "dts-backend-postgres"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "DTS Platform — PostgreSQL 协议存储后端（支持 PostgreSQL / GaussDB / Kingbase / openGauss 等）"

[dependencies]
dts-backend = { path = "../dts-backend" }
dts-backend-rdbms = { path = "../dts-backend-rdbms" }
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
argon2 = "0.5"

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }
uuid = { workspace = true, features = ["v4"] }
dts-backend = { path = "../dts-backend" }
dts-core = { path = "../dts-core" }
dts-backend-rdbms = { path = "../dts-backend-rdbms" }
chrono = { workspace = true }
