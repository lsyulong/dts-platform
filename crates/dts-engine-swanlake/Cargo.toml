[package]
name = "dts-engine-swanlake"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SwanLake Flight SQL adapter for DuckDB/DuckLake synchronization"

[lints]
workspace = true

[dependencies]
dts-engine = { path = "../dts-engine" }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"
futures = "0.3"
arrow-array = "58"
arrow-flight = { version = "58", features = ["flight-sql"] }
prost = "0.14"
tonic = "0.14"
url = "2"

