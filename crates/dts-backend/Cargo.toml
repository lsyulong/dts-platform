[package]
name = "dts-backend"
version = "0.1.0"
edition = "2021"
description = "DTS Platform — 存储后端核心抽象层（trait + 公共类型）"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["sync"] }
