# DTS Platform - Render Blueprint
# 连接 GitHub 仓库后，Render 自动读取此文件创建服务

services:
  - type: web
    name: dts-platform-api
    env: docker
    region: singapore
    plan: free
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY_HOURS
        value: "24"
      - key: SERVER_HOST
        value: "0.0.0.0"
      - key: SERVER_PORT
        value: "8080"
      - key: RUST_LOG
        value: "info,dts_server=debug"
    autoDeploy: true
