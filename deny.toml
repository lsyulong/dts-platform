# DTS Platform - cargo-deny 配置
# 依赖安全审计规则

# --------------------------------------------------
# 安全公告
# --------------------------------------------------
[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
ignore = []

# --------------------------------------------------
# 许可合规
# --------------------------------------------------
[licenses]
unlicensed = "deny"
allow-osi-fsf-free = "either"
copyleft = "deny"
default = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Unlicense",
    "BSD-3-Clause",
    "ISC",
]
exceptions = []

# --------------------------------------------------
# Crate 来源限制
# --------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"

# --------------------------------------------------
# 重复依赖检测
# --------------------------------------------------
[bans]
multiple-versions = "warn"
deny = []

# --------------------------------------------------
# CI 输出的 Lint 级别映射
# --------------------------------------------------
[output]
feature-depth = 1
